name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check Skir code formatting
        run: npx --yes --package skir@1.2.12 --package "file:../csharp-generator" skir format --ci

      - name: Run Skir-to-CSharp codegen
        run: npx --yes --package skir@1.2.12 --package "file:../csharp-generator" skir gen

      - name: Build
        run: dotnet build CsharpExample.csproj -warnaserror

      - name: Run
        run: dotnet run --project CsharpExample.csproj
